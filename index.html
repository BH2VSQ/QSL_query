<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="快速查询 QSL 卡号、卡号前缀与业余无线电通联记录。">
  <title>QSL Query · QSL 信息查询</title>
  <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <style>
    :root {
      color-scheme: light;
      --page: #f7f9fc;
      --surface: rgba(255,255,255,.84);
      --surface-solid: #fff;
      --text: #172033;
      --muted: #778198;
      --line: rgba(117,132,160,.22);
      --accent: #5268f4;
      --accent-2: #8b5cf6;
      --shadow: 0 24px 70px rgba(32,48,90,.11);
      --soft-shadow: 0 12px 36px rgba(32,48,90,.08);
    }
    html.dark {
      color-scheme: dark;
      --page: #0b1020;
      --surface: rgba(19,27,48,.82);
      --surface-solid: #131b30;
      --text: #edf2ff;
      --muted: #98a4bd;
      --line: rgba(151,166,204,.16);
      --accent: #91a2ff;
      --accent-2: #c4a3ff;
      --shadow: 0 24px 70px rgba(0,0,0,.26);
      --soft-shadow: 0 12px 36px rgba(0,0,0,.18);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(ellipse at 12% 11%, rgba(115,139,255,.14), transparent 30rem),
        radial-gradient(ellipse at 88% 21%, rgba(191,132,255,.12), transparent 29rem),
        var(--page);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      transition: background-color .28s ease, color .28s ease;
    }
    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: "";
      opacity: .22;
      background-image: radial-gradient(rgba(125,145,190,.45) .7px, transparent .7px);
      background-size: 22px 22px;
      mask-image: linear-gradient(to bottom, black, transparent 75%);
    }
    ::selection { color: white; background: #6577ed; }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(125,140,171,.42); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(125,140,171,.65); }

    .page-shell { width: min(1320px, calc(100% - 48px)); margin: 0 auto; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:24px; padding:26px 0 18px; }
    .brand { display:inline-flex; align-items:center; gap:12px; min-width:0; color:var(--text); text-decoration:none; }
    .brand-mark {
      display:grid; place-items:center; width:42px; height:42px; flex:none; border-radius:14px;
      color:#fff; background:linear-gradient(145deg,#687cf8,#9b6cf2); box-shadow:0 8px 22px rgba(95,112,238,.28);
    }
    .brand-name { font-size:16px; line-height:1.2; font-weight:800; letter-spacing:.12em; }
    .brand-subtitle { margin-top:4px; font-size:11px; color:var(--muted); letter-spacing:.035em; }
    .topbar-actions { display:flex; align-items:center; gap:8px; }
    .utility-button {
      display:inline-flex; align-items:center; justify-content:center; gap:8px; min-width:42px; height:42px; padding:0 12px;
      border:1px solid var(--line); border-radius:14px; color:var(--muted); background:var(--surface);
      backdrop-filter: blur(14px); transition:transform .18s ease, border-color .18s ease, color .18s ease, background .18s ease;
    }
    .utility-button:hover { transform:translateY(-1px); color:var(--text); border-color:rgba(117,132,255,.42); }
    .utility-button:focus-visible, .search-button:focus-visible, .clear-button:focus-visible, .search-input:focus-visible { outline:3px solid rgba(106,125,255,.35); outline-offset:3px; }
    .status-pill { display:inline-flex; align-items:center; gap:8px; max-width:220px; font-size:11px; color:var(--muted); white-space:nowrap; }
    .status-dot { width:7px; height:7px; border-radius:50%; flex:none; background:#94a3b8; box-shadow:0 0 0 4px rgba(148,163,184,.12); }
    .status--success .status-dot { background:#34d399; box-shadow:0 0 0 4px rgba(52,211,153,.13); }
    .status--info .status-dot { background:#fbbf24; box-shadow:0 0 0 4px rgba(251,191,36,.13); }
    .status--error .status-dot { background:#fb7185; box-shadow:0 0 0 4px rgba(251,113,133,.13); }
    #status-message { display:inline-flex; align-items:center; min-width:0; }
    #status-text { overflow:hidden; text-overflow:ellipsis; }

    .hero {
      min-height: min(710px, calc(100svh - 104px));
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:42px 0 90px; text-align:center; position:relative; isolation:isolate;
    }
    .hero-orb { position:absolute; z-index:-1; border-radius:50%; filter:blur(1px); pointer-events:none; animation:float 9s ease-in-out infinite; }
    .hero-orb.orb-a { width:180px; height:180px; top:13%; left:8%; background:radial-gradient(circle at 35% 35%,rgba(107,130,255,.15),rgba(107,130,255,0) 70%); }
    .hero-orb.orb-b { width:240px; height:240px; right:4%; bottom:15%; background:radial-gradient(circle at 45% 45%,rgba(184,130,255,.14),rgba(184,130,255,0) 70%); animation-delay:-4s; }
    @keyframes float { 0%,100% { transform:translate3d(0,0,0); } 50% { transform:translate3d(0,-13px,0); } }
    .eyebrow {
      display:inline-flex; align-items:center; gap:9px; padding:8px 13px; margin-bottom:23px; border:1px solid var(--line); border-radius:999px;
      color:var(--muted); background:var(--surface); font-size:10px; line-height:1; font-weight:800; letter-spacing:.18em;
      box-shadow:0 6px 20px rgba(30,50,100,.035); backdrop-filter:blur(12px);
    }
    .eyebrow-mark { width:6px; height:6px; border-radius:50%; background:linear-gradient(135deg,#6785ff,#b08cff); box-shadow:0 0 0 4px rgba(117,133,255,.11); }
    .hero-title { max-width:850px; margin:0; font-size:clamp(38px,6.3vw,68px); line-height:1.13; letter-spacing:-.055em; font-weight:850; }
    .hero-title .gradient-word { color:transparent; background:linear-gradient(100deg,#6883ff 8%,#a077f7 58%,#cc86e9 100%); -webkit-background-clip:text; background-clip:text; }
    .hero-subtitle { max-width:580px; margin:22px auto 34px; color:var(--muted); font-size:clamp(14px,1.8vw,17px); line-height:1.85; }
    .search-wrap { width:min(760px,100%); position:relative; text-align:left; }
    .search-frame {
      display:flex; align-items:center; gap:13px; width:100%; min-height:76px; padding:10px 11px 10px 24px;
      border:1px solid rgba(131,146,180,.3); border-radius:23px; background:var(--surface-solid);
      box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.25); transition:border-color .2s ease, transform .2s ease, box-shadow .2s ease;
    }
    .search-frame:focus-within { border-color:rgba(108,128,255,.68); transform:translateY(-2px); box-shadow:0 28px 76px rgba(75,94,190,.16), 0 0 0 5px rgba(106,125,255,.08); }
    .search-icon { flex:none; width:24px; height:24px; color:#8591ab; }
    .search-input { flex:1; min-width:0; height:52px; border:0!important; outline:none!important; box-shadow:none!important; padding:0!important; color:var(--text)!important; background:transparent!important; font-size:16px; }
    .search-input::placeholder { color:#9aa4b9; opacity:1; }
    .search-input::-webkit-search-cancel-button { display:none; }
    .clear-button { display:none; width:32px; height:32px; flex:none; place-items:center; border:0; border-radius:10px; color:var(--muted); background:transparent; cursor:pointer; }
    .clear-button.visible { display:grid; }
    .clear-button:hover { background:rgba(130,145,180,.12); color:var(--text); }
    .search-button {
      display:inline-flex; align-items:center; justify-content:center; gap:10px; flex:none; min-width:128px; height:54px; padding:0 21px;
      border:0; border-radius:16px; color:#fff; background:linear-gradient(115deg,#6378f4,#8c68f4); font-size:14px; font-weight:750; letter-spacing:.02em;
      box-shadow:0 8px 20px rgba(100,111,232,.27); cursor:pointer; transition:transform .18s ease, box-shadow .18s ease, opacity .18s ease;
    }
    .search-button:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 12px 27px rgba(100,111,232,.35); }
    .search-button:active:not(:disabled) { transform:translateY(0); }
    .search-button:disabled { opacity:.5; cursor:not-allowed; box-shadow:none; }
    .search-help { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; padding:15px 8px 0; color:var(--muted); font-size:12px; }
    .help-item { display:inline-flex; align-items:center; gap:7px; }
    .help-icon { width:15px; height:15px; opacity:.78; }
    .keycap { display:inline-grid; place-items:center; min-width:23px; height:22px; padding:0 6px; border:1px solid var(--line); border-radius:6px; color:var(--muted); background:var(--surface); font-size:10px; font-weight:700; }
    .search-capabilities { display:flex; justify-content:center; flex-wrap:wrap; gap:9px; margin-top:28px; }
    .capability { display:inline-flex; align-items:center; gap:7px; padding:8px 12px; border:1px solid var(--line); border-radius:999px; color:var(--muted); background:var(--surface); font-size:11px; backdrop-filter:blur(10px); }
    .capability svg { width:14px; height:14px; color:#8998ff; }

    .results-layout { display:grid; grid-template-columns:minmax(0, 1fr); gap:0; align-items:start; margin:0 0 48px; }
    .results-main { min-width:0; }
    .results-summary { display:flex; align-items:center; justify-content:space-between; gap:16px; margin:0 0 18px; padding:5px 2px 15px; border-bottom:1px solid var(--line); color:var(--muted); font-size:12px; }
    .results-summary-main { display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; min-width:0; }
    .results-summary-title { color:var(--text); font-size:14px; font-weight:800; }
    .results-total { flex:none; white-space:nowrap; }
    #loading { color:var(--muted); padding:44px 0; }
    #loading .animate-spin { color:var(--accent); }
    #results-area { padding:0 0 34px; display:grid; gap:22px; min-width:0; }
    #no-results { margin:8px 0 34px; padding:42px 20px; border:1px solid var(--line); border-radius:24px; background:var(--surface); box-shadow:var(--soft-shadow); }


    .result-card { overflow:hidden; border:1px solid var(--line); border-radius:20px; background:var(--surface); box-shadow:var(--soft-shadow); backdrop-filter:blur(14px); }
    .result-card-header { display:flex; align-items:center; flex-wrap:wrap; gap:12px; padding:19px 23px; border-bottom:1px solid var(--line); background:rgba(126,142,184,.045); }
    .result-card-header h3 { margin:0; font-weight:750; overflow-wrap:anywhere; }
    .result-table-wrap { overflow-x:auto; }
    .result-table { width:100%; min-width:760px; border-collapse:separate; border-spacing:0; }
    .result-table th { padding:13px 15px; border-bottom:1px solid var(--line); color:var(--muted); background:rgba(120,137,174,.055); font-size:10px; font-weight:800; text-align:left; letter-spacing:.08em; }
    .result-table td { padding:13px 15px; border-bottom:1px solid var(--line); color:var(--text); font-size:12px; vertical-align:top; }
    .result-table tbody tr:last-child td { border-bottom:0; }
    .result-table tbody tr:hover td { background:rgba(115,132,255,.045); }
    .result-table td.comment-cell { min-width:170px; max-width:330px; white-space:normal; overflow-wrap:anywhere; }
    .result-count { margin-left:auto; color:var(--muted); font-size:11px; font-weight:600; }
    .footer { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:21px 0 27px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; }
    .footer-brand { display:inline-flex; align-items:center; gap:8px; font-weight:800; letter-spacing:.1em; }
    .footer-dot { width:5px; height:5px; border-radius:50%; background:linear-gradient(135deg,#6883ff,#c086f2); }
    .footer-note { text-align:right; }
    .has-results .hero { min-height:0; align-items:stretch; text-align:left; padding-top:12px; padding-bottom:26px; }
    .has-results .hero-orb,
    .has-results .eyebrow,
    .has-results .hero-title,
    .has-results .hero-subtitle,
    .has-results .search-help,
    .has-results .search-capabilities { display:none!important; }
    .has-results .search-wrap { width:min(820px,100%); margin:0; }
    .has-results .search-frame { min-height:64px; }
    .has-results .search-input { height:44px; }
    .has-results .search-button { height:46px; }
    .hidden { display:none!important; }

    @media (max-width: 980px) {
      .results-layout { grid-template-columns:minmax(0,1fr); gap:0; }
    }

    /* Small-screen layout: keep controls touch-friendly and render result rows as readable cards. */
    @media (max-width: 680px) {
      html, body { max-width:100%; overflow-x:hidden; }
      .page-shell { width:calc(100% - 24px); max-width:560px; }
      .topbar { padding:14px 0 12px; gap:8px; }
      .brand { gap:9px; }
      .brand-mark { width:38px; height:38px; border-radius:12px; }
      .brand-name { font-size:12px; letter-spacing:.09em; }
      .brand-subtitle { font-size:10px; }
      .topbar-actions { gap:6px; flex:none; }
      .status-pill { max-width:12px; margin-right:1px; font-size:10px; }
      #status-text { display:none; }
      .utility-button { height:44px; min-width:44px; padding:0 9px; border-radius:12px; }
      .hero { min-height:calc(100svh - 72px); min-height:calc(100dvh - 72px); padding:32px 0 46px; }
      .hero-orb.orb-a { left:-32%; top:8%; }
      .hero-orb.orb-b { right:-34%; bottom:8%; }
      .eyebrow { margin-bottom:17px; padding:7px 10px; font-size:9px; letter-spacing:.1em; }
      .hero-title { font-size:clamp(32px,9vw,44px); line-height:1.15; letter-spacing:-.045em; }
      .hero-subtitle { margin:15px auto 24px; font-size:14px; line-height:1.7; }
      .search-frame { min-height:64px; gap:7px; padding:7px 7px 7px 13px; border-radius:18px; }
      .search-icon { width:20px; height:20px; }
      .search-input { height:48px; min-width:0; font-size:16px; }
      .search-button { min-width:48px; width:48px; height:48px; padding:0; border-radius:13px; }
      .search-button .button-label { display:none; }
      .search-help { padding:12px 2px 0; font-size:11px; }
      .search-capabilities { gap:7px; margin-top:20px; }
      .capability { font-size:10px; padding:7px 9px; }
      .has-results .hero { padding-top:8px; padding-bottom:15px; min-height:0; }
      .has-results .search-wrap { width:100%; }
      .has-results .search-frame { min-height:58px; padding-left:12px; }
      .has-results .search-input { height:42px; }
      .has-results .search-button { width:46px; min-width:46px; height:44px; }
      .results-layout { gap:12px; margin-bottom:22px; }
      .results-summary { flex-direction:row; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; padding:4px 1px 10px; scroll-margin-top:12px; }
      .results-summary-main { gap:6px; }
      .results-summary-title { font-size:14px; }
      .results-total { font-size:11px; text-align:right; white-space:normal; }
      #loading { padding:28px 0; }
      #no-results { margin:8px 0 22px; padding:28px 15px; border-radius:17px; font-size:13px; line-height:1.7; }
      #results-area { gap:14px; padding-bottom:22px; }
      .result-card { border-radius:16px; backdrop-filter:none; }
      .result-card-header { align-items:flex-start; gap:8px; padding:13px 14px; }
      .result-card-header h3 { flex:1 1 100%; font-size:15px; line-height:1.45; }
      .result-card-header .result-count { margin-left:0; font-size:11px; }
      .result-table-wrap { overflow:visible; }
      .result-table, .result-table tbody { display:block; width:100%; min-width:0; }
      .result-table thead { display:none; }
      .result-table tr { display:block; padding:7px 13px; border-bottom:1px solid var(--line); }
      .result-table tbody tr:last-child { border-bottom:0; }
      .result-table td {
        display:grid; grid-template-columns:minmax(82px, 32%) minmax(0, 1fr); align-items:start; gap:10px;
        width:100%; min-width:0; padding:8px 0; border-bottom:1px dashed var(--line);
        font-size:13px; line-height:1.5; white-space:normal; overflow-wrap:anywhere; word-break:normal;
      }
      .result-table td::before { content:attr(data-label); min-width:0; color:var(--muted); font-size:11px; font-weight:700; line-height:1.6; }
      .result-table td:last-child { border-bottom:0; }
      .result-table td.comment-cell { min-width:0; max-width:none; }
      .result-table td.text-center { text-align:left; }
      .status-badge-wrap { justify-self:start; flex-wrap:wrap; }
      .status-tooltip { display:none; }
      .status-badge-wrap:focus .status-tooltip,
      .status-badge-wrap:focus-visible .status-tooltip {
        display:block; position:static; visibility:visible; opacity:1; transform:none; margin:6px 0 0;
        max-width:min(220px, 58vw); white-space:normal; text-align:left; pointer-events:auto; line-height:1.55;
      }
      .status-tooltip > div:last-child { display:none; }
      .footer { align-items:flex-start; flex-direction:column; gap:8px; padding:18px 0 22px; }
      .footer-note { text-align:left; }
    }
    @media (max-width: 380px) {
      .page-shell { width:calc(100% - 20px); }
      .brand-name { font-size:11px; }
      .topbar-actions { gap:4px; }
      .utility-button { min-width:42px; width:42px; padding:0 7px; }
      .result-table tr { padding-left:10px; padding-right:10px; }
      .result-table td { grid-template-columns:minmax(72px, 30%) minmax(0, 1fr); gap:8px; }
    }
    @media (max-width: 760px) and (max-height: 560px) {
      .hero { min-height:0; padding:30px 0 34px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior:auto!important; animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; }
    }
  </style>
</head>
<body class="font-sans transition-colors duration-300">
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="QSL Query home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="25" height="25" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="13.5" cy="13.5" r="7.5" stroke="currentColor" stroke-width="2.6"/>
            <path d="m19.2 19.2 6.1 6.1M9.5 13.5h8M13.5 9.5v8" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
          </svg>
        </span>
        <span>
          <span class="brand-name block">QSL QUERY</span>
        </span>
      </a>
      <div class="topbar-actions">
        <div id="status-message" class="status-pill status--info" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span><span id="status-text">正在初始化数据库…</span>
        </div>
        <button id="lang-toggle" class="utility-button" type="button" aria-label="Switch language">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span id="lang-text">EN</span>
        </button>
        <button id="theme-toggle" class="utility-button" type="button" aria-label="Toggle color theme">
          <svg id="theme-icon-light" class="hidden" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
          <svg id="theme-icon-dark" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg>
        </button>
      </div>
    </header>

    <main>
      <section class="hero" id="search-hero" aria-labelledby="main-title">
        <span class="hero-orb orb-a" aria-hidden="true"></span>
        <span class="hero-orb orb-b" aria-hidden="true"></span>
        <div class="eyebrow"><span class="eyebrow-mark"></span><span id="eyebrow-text">AMATEUR RADIO · QSL DIRECTORY</span></div>
        <h1 class="hero-title" id="main-title">查找你的 <span class="gradient-word">QSL 记录</span></h1>
        <p class="hero-subtitle" id="hero-subtitle">快速找到卡片编号、呼号以及对应的通联记录。</p>

        <form id="search-form" class="search-wrap" role="search" autocomplete="off">
          <div class="search-frame">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.1"/><path d="m16.2 16.2 4.3 4.3"/></svg>
            <input id="qsl-id-input" class="search-input" type="search" placeholder="输入 QSL 卡号或呼号" aria-label="输入 QSL 卡号、卡号前缀或呼号" spellcheck="false" autocapitalize="characters" autocomplete="off">

    let currentLang = 'zh';

    function setTextIfPresent(id, value) {
      const element = document.getElementById(id);
      if (element) element.textContent = value == null ? '' : String(value);
    }

    function getStoredSetting(key) {
      try { return window.localStorage.getItem(key); } catch (_) { return null; }
    }

    function setStoredSetting(key, value) {
      try { window.localStorage.setItem(key, value); } catch (_) { /* Storage may be blocked in private or file contexts. */ }
    }

    function updateContent(lang, rerender = true) {
      currentLang = lang;
      const t = TRANSLATIONS[lang];
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      document.title = t.TITLE;
      const description = document.querySelector('meta[name="description"]');
      if (description) description.setAttribute('content', t.DESCRIPTION);
      document.querySelector('.brand')?.setAttribute('aria-label', t.BRAND_LABEL);
      langToggle.setAttribute('aria-label', t.LANGUAGE_TOGGLE);
      themeToggle.setAttribute('aria-label', t.THEME_TOGGLE);
      clearButton.setAttribute('aria-label', t.CLEAR_SEARCH);
      clearButton.title = t.CLEAR_SEARCH;
      resultsLayout.setAttribute('aria-label', t.RESULTS_LABEL);
      resultsArea.setAttribute('aria-label', t.RESULTS_LABEL);
      document.getElementById('eyebrow-text').textContent = t.EYEBROW;
      document.getElementById('main-title').innerHTML = t.MAIN_TITLE;
      document.getElementById('hero-subtitle').textContent = t.SUBTITLE;
      qslIdInput.placeholder = t.PLACEHOLDER;
      qslIdInput.setAttribute('aria-label', t.PLACEHOLDER);
      document.getElementById('search-button-text').textContent = t.SEARCH_BUTTON;
      setTextIfPresent('search-hint', t.SEARCH_HINT);
      setTextIfPresent('enter-hint', t.ENTER_HINT);
      setTextIfPresent('feature-qsl', t.FEATURE_QSL);
      setTextIfPresent('feature-callsign', t.FEATURE_CALLSIGN);
      setTextIfPresent('feature-auto', t.FEATURE_AUTO);
      document.getElementById('loading-text').textContent = t.LOADING;
      document.getElementById('no-results-text').textContent = t.NO_RESULTS;
      if (lastSearch && !resultsLayout.classList.contains('hidden')) {
        resultsSummaryTitle.textContent = t.SEARCH_RESULTS;
      }
      langText.textContent = t.LANG_TOGGLE;
      if (statusKind === 'ready') showStatus(t.STATUS_READY, 'success');
      else if (statusKind === 'error') showStatus(t.STATUS_ERROR, 'error');
      else showStatus(t.STATUS_INIT, 'info');
      if (rerender && lastSearch && (resultsArea.innerHTML !== '' || !noResultsMessage.classList.contains('hidden'))) {
        performSearch(lastSearch.input, lastSearch.type, true);
      }
    }

    langToggle.addEventListener('click', () => {
      const newLang = currentLang === 'zh' ? 'en' : 'zh';
      setStoredSetting('lang', newLang);
      updateContent(newLang);
    });

    function applyTheme(isDark) {
      document.documentElement.classList.toggle('dark', isDark);
      themeIconLight.classList.toggle('hidden', !isDark);
      themeIconDark.classList.toggle('hidden', isDark);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', isDark ? '#0b1020' : '#f7f9fc');
    }
    themeToggle.addEventListener('click', () => {
      const isDark = !document.documentElement.classList.contains('dark');
      setStoredSetting('theme', isDark ? 'dark' : 'light');
      applyTheme(isDark);
    });
    const savedTheme = getStoredSetting('theme');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(savedTheme ? savedTheme === 'dark' : Boolean(prefersDark));

    function showStatus(message, type = 'info') {
      statusKind = type === 'success' ? 'ready' : type === 'error' ? 'error' : 'info';
      statusMessage.classList.remove('status--info', 'status--success', 'status--error');
      statusMessage.classList.add(type === 'success' ? 'status--success' : type === 'error' ? 'status--error' : 'status--info');
      statusText.textContent = message;
      statusMessage.title = message;
    }

    const SQL_JS_SOURCES = [
      {
        script: 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js',
        base: 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/'
      },
      {
        script: 'https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js',
        base: 'https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/'
      }
    ];

    function withTimeout(promise, timeoutMs, message) {
      let timer;
      return Promise.race([
        Promise.resolve(promise),
        new Promise((_, reject) => {
          timer = window.setTimeout(() => reject(new Error(message)), timeoutMs);
        })
      ]).finally(() => window.clearTimeout(timer));
    }

    function loadExternalScript(src, timeoutMs = 10000) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        let finished = false;
        const finish = error => {
          if (finished) return;
          finished = true;
          window.clearTimeout(timer);
          script.onload = null;
          script.onerror = null;
          if (error) {
            script.remove();
            reject(error);
          } else {
            resolve();
          }
        };
        const timer = window.setTimeout(() => {
          finish(new Error(TRANSLATIONS[currentLang].ERR_SCRIPT_TIMEOUT(src))); 
        }, timeoutMs);
        script.async = true;
        script.onload = () => finish();
        script.onerror = () => finish(new Error(TRANSLATIONS[currentLang].ERR_SCRIPT_LOAD(src))); 
        script.src = src;
        document.head.appendChild(script);
      });
    }

    async function loadSqlEngine() {
      let loadedBase = null;
      if (typeof window.initSqlJs !== 'function') {
        const loadErrors = [];
        for (const source of SQL_JS_SOURCES) {
          try {
            await loadExternalScript(source.script);
            if (typeof window.initSqlJs !== 'function') {
              throw new Error(TRANSLATIONS[currentLang].ERR_SQL_JS_API);
            }
            loadedBase = source.base;
            break;
          } catch (error) {
            loadErrors.push(error.message);
          }
        }
        if (typeof window.initSqlJs !== 'function') {
          throw new Error(TRANSLATIONS[currentLang].ERR_SQL_JS_LOAD(loadErrors.join(currentLang === 'zh' ? '；' : '; ')));
        }
      }

      const bases = [loadedBase, ...SQL_JS_SOURCES.map(source => source.base)].filter((base, index, arr) => base && arr.indexOf(base) === index);
      const wasmErrors = [];
      for (const base of bases) {
        try {
          return await withTimeout(
            window.initSqlJs({ locateFile: file => new URL(file, base).href }),
            12000,
            TRANSLATIONS[currentLang].ERR_WASM_TIMEOUT(base)
          );
        } catch (error) {
          wasmErrors.push(error.message);
        }
      }
      throw new Error(TRANSLATIONS[currentLang].ERR_SQL_INIT(wasmErrors.join(currentLang === 'zh' ? '；' : '; ')));
    }

    async function initDb() {
      showStatus(TRANSLATIONS[currentLang].STATUS_ENGINE, 'info');
      searchButton.disabled = true;
      try {
        const SQL = await loadSqlEngine();
        showStatus(TRANSLATIONS[currentLang].STATUS_FETCH, 'info');

        let response;
        try {
          response = await withTimeout(
            fetch(new URL('qsl_manager.db', document.baseURI).href, { cache: 'default' }),
            20000,
            TRANSLATIONS[currentLang].ERR_DB_FETCH_TIMEOUT
          );
        } catch (error) {
          throw new Error(error.name === 'AbortError'
            ? TRANSLATIONS[currentLang].ERR_DB_ABORTED
            : (error instanceof TypeError ? TRANSLATIONS[currentLang].ERR_DB_NETWORK : error.message));
        }
        if (!response.ok) {
          throw new Error(TRANSLATIONS[currentLang].ERR_DB_HTTP(response.status));
        }
        const fileBuffer = await withTimeout(
          response.arrayBuffer(),
          15000,
          TRANSLATIONS[currentLang].ERR_DB_READ_TIMEOUT
        );
        if (!fileBuffer.byteLength) throw new Error(TRANSLATIONS[currentLang].ERR_DB_EMPTY);

        db = new SQL.Database(new Uint8Array(fileBuffer));
        showStatus(TRANSLATIONS[currentLang].STATUS_INDEX, 'info');
        // These indexes exist only in this in-memory session and do not alter the source DB file.
        db.exec(`
          PRAGMA temp_store = MEMORY;
          CREATE INDEX IF NOT EXISTS idx_qsl_log_link_log_id ON qsl_log_link(log_id, qsl_id);
          CREATE INDEX IF NOT EXISTS idx_logs_callsign_nocase ON logs(station_callsign COLLATE NOCASE);
        `);

        showStatus(TRANSLATIONS[currentLang].STATUS_READY, 'success');
        searchButton.disabled = false;
      } catch (error) {
        console.error('QSL database initialization failed:', error);
        showStatus(`${TRANSLATIONS[currentLang].STATUS_ERROR}: ${error.message || error}`, 'error');
        searchButton.disabled = true;
      }
    }

    function queryQsl(searchInput) {
      const searchTerms = searchInput.split(',').map(term => term.trim()).filter(Boolean);
      if (!searchTerms.length) return { results: [], notFoundItems: [] };
      const whereConditions = searchTerms.map(() => 'q.qsl_id LIKE ?').join(' OR ');
      const query = `
        SELECT q.qsl_id, q.direction, q.status, l.*
        FROM qsl_cards q
        JOIN qsl_log_link ql ON q.qsl_id = ql.qsl_id
        JOIN logs l ON ql.log_id = l.id
        WHERE ${whereConditions}
        ORDER BY q.qsl_id, l.qso_date DESC, l.time_on DESC;
      `;
      const stmt = db.prepare(query);
      stmt.bind(searchTerms.map(term => `${term}%`));
      const results = [];
      while (stmt.step()) results.push(stmt.getAsObject());
      stmt.free();
      const foundQslIds = results.map(row => String(row.qsl_id || '').toUpperCase());
      const notFoundItems = searchTerms.filter(term => !foundQslIds.some(foundId => foundId.startsWith(term)));
      return { results, notFoundItems };
    }

    function queryCallsign(searchInput) {
      let baseCallsign = searchInput;
      const slashIndex = searchInput.indexOf('/');
      if (slashIndex !== -1) baseCallsign = searchInput.substring(0, slashIndex);
      const query = `
        SELECT l.*, GROUP_CONCAT(q.qsl_id) AS linked_qsl_ids
        FROM logs l
        LEFT JOIN qsl_log_link ql ON l.id = ql.log_id
        LEFT JOIN qsl_cards q ON ql.qsl_id = q.qsl_id
        WHERE l.id IN (
          SELECT id FROM logs WHERE station_callsign = ? COLLATE NOCASE
          UNION
          SELECT id FROM logs WHERE station_callsign LIKE ?
        )
        GROUP BY l.id
        ORDER BY l.qso_date DESC, l.time_on DESC;
      `;
      const stmt = db.prepare(query);
      stmt.bind([baseCallsign, `${baseCallsign}/%`]);
      const results = [];
      while (stmt.step()) results.push(stmt.getAsObject());
      stmt.free();
      return results;
    }

    function updateResultsSummary(count = null) {
      const t = TRANSLATIONS[currentLang];
      resultsSummary.classList.remove('hidden');
      resultsSummaryTitle.textContent = t.SEARCH_RESULTS;
      resultsTotal.textContent = count === null ? t.LOADING : t.RECORD_COUNT(count);
    }

    async function performSearch(input, type = 'auto', keepInput = false) {
      if (!db) {
        alert(TRANSLATIONS[currentLang].ALERT_DB);
        return;
      }
      const t = TRANSLATIONS[currentLang];
      const searchInput = String(input == null ? qslIdInput.value : input).trim().toUpperCase();
      if (!searchInput) {
        qslIdInput.focus();
        return;
      }
      lastSearch = { input: searchInput, type: type || 'auto' };
      document.body.classList.add('has-results');
      resultsLayout.classList.remove('hidden');
      updateResultsSummary(null);
      loadingIndicator.classList.remove('hidden');
      resultsArea.innerHTML = '';
      noResultsMessage.classList.add('hidden');
      await new Promise(resolve => setTimeout(resolve, 0));

      try {
        let results = [];
        let notFoundItems = [];
        let searchType = type || 'auto';
        if (searchType === 'qsl') {
          const queryResult = queryQsl(searchInput);
          results = queryResult.results;
          notFoundItems = queryResult.notFoundItems;
        } else if (searchType === 'callsign') {
          results = queryCallsign(searchInput);
        } else if (searchInput.includes(',')) {
          // A comma-separated input preserves the existing multi-QSL-ID search behaviour.
          const queryResult = queryQsl(searchInput);
          results = queryResult.results;
          notFoundItems = queryResult.notFoundItems;
          searchType = 'qsl';
        } else {
          // Unified search: try QSL ID/prefix first, then automatically fall back to callsign.
          const qslResult = queryQsl(searchInput);
          if (qslResult.results.length > 0) {
            results = qslResult.results;
            searchType = 'qsl';
          } else {
            results = queryCallsign(searchInput);
            searchType = 'callsign';
            // Preserve the useful QSL-prefix not-found message for inputs that look like card IDs.
            if (!results.length && /(?:TC|RC)/i.test(searchInput)) {
              notFoundItems = qslResult.notFoundItems;
              searchType = 'qsl';
            }
          }
        }
        displayResults(results, notFoundItems, searchType);
        if (results.length) {
          setTimeout(() => document.getElementById('results-summary').scrollIntoView({ behavior: 'smooth', block: 'start' }), 30);
        }
      } catch (error) {
        console.error(error);
        alert(`${t.ALERT_SEARCH}${error.message}`);
      } finally {
        loadingIndicator.classList.add('hidden');
      }
    }

    function formatDate(dateStr) {
      if (!dateStr || dateStr.length !== 8) return dateStr;
      return `${dateStr.substring(0, 4)}-${dateStr.substring(4, 6)}-${dateStr.substring(6, 8)}`;
    }

    function createStatusBadge(status, dateStr, linkedQslIds, direction) {
      if (status !== 'Y') return `<span class="text-red-500" aria-label="${TRANSLATIONS[currentLang].NOT_CONFIRMED}" title="${TRANSLATIONS[currentLang].NOT_CONFIRMED}">✖</span>`;
      const t = TRANSLATIONS[currentLang];
      const formattedDate = formatDate(dateStr);
      const isPending = !formattedDate;
      let displayId = 'N/A';
      let tooltipContent = '';
      if (linkedQslIds) {
        const directionPrefix = direction === 'SENT' ? 'TC' : 'RC';
        const qslIdList = linkedQslIds.split(',');
        const relevantQslId = qslIdList.find(id => id.includes(directionPrefix));
        if (relevantQslId) {
          const index = relevantQslId.indexOf(directionPrefix);
          displayId = index !== -1 ? relevantQslId.substring(0, index + directionPrefix.length) : relevantQslId;
        }
      }
      if (displayId !== 'N/A') tooltipContent += `<div class="font-bold">${t.TOOLTIP_QSL_ID} ${displayId}</div>`;
      if (isPending) {
        const pendingLabel = direction === 'SENT' ? t.PENDING_OUT_STATUS : t.PENDING_IN_STATUS;
        tooltipContent += `<div class="${displayId !== 'N/A' ? 'mt-0.5' : ''}">${pendingLabel}</div>`;
      } else if (formattedDate) {
        tooltipContent += `<div class="${displayId !== 'N/A' ? 'mt-0.5' : ''}">${t.TOOLTIP_TIME} ${formattedDate}</div>`;
      }
      const indicator = isPending
        ? '<span class="inline-block w-3.5 h-3.5 rounded-full bg-yellow-400 dark:bg-yellow-500 ring-2 ring-yellow-200 dark:ring-yellow-800"></span>'
        : '<span class="text-green-500 font-bold">✔</span>';
      return `
        <div class="group status-badge-wrap relative inline-flex justify-center items-center cursor-help" tabindex="0" role="button" aria-label="${direction === 'SENT' ? t.QSL_SENT_DETAIL : t.QSL_RECEIVED_DETAIL}">
          ${indicator}
          <div class="status-tooltip invisible group-hover:visible opacity-0 group-hover:opacity-100 transition-opacity duration-300 absolute right-full mr-2 top-1/2 transform -translate-y-1/2 bg-gray-900 dark:bg-gray-700 text-white text-xs rounded py-1 px-2 z-50 shadow-lg pointer-events-none border border-gray-700 text-center max-w-min whitespace-nowrap">
            ${tooltipContent}
            <div class="absolute left-full top-1/2 transform -translate-y-1/2 border-4 border-transparent border-l-gray-900 dark:border-l-gray-700"></div>
          </div>
        </div>`;
    }

    function displayResults(results, notFoundItems, searchType) {
      const t = TRANSLATIONS[currentLang];
      updateResultsSummary(results.length);
      if (results.length === 0) {
        noResultsMessage.classList.remove('hidden');
        if (searchType === 'qsl' && notFoundItems && notFoundItems.length > 0) {
          noResultsMessage.innerHTML = `<p class="text-gray-500 dark:text-gray-400">${t.NOT_FOUND_QSL_PREFIX}</p><p class="font-mono text-red-500 mt-2">${notFoundItems.join(', ')}</p>`;
        } else {
          noResultsMessage.innerHTML = `<p class="text-gray-500 dark:text-gray-400">${t.NO_RESULTS}</p>`;
        }
        return;
      }

      noResultsMessage.innerHTML = `<p class="text-gray-500 dark:text-gray-400">${t.NO_RESULTS}</p>`;
      let html = '';
      if (searchType === 'callsign') {
        const columns = t.CALLSIGN_LOG_COLUMNS;
        const displayCallsign = results[0]?.station_callsign || lastSearch?.input || '';
        html += `
          <div class="result-card">
            <div class="result-card-header"><h3 class="text-lg text-gray-900 dark:text-white">${t.CALLSIGN_RESULT_TITLE(displayCallsign)}</h3><span class="result-count">${t.RECORD_COUNT(results.length)}</span></div>
            <div class="result-table-wrap"><table class="result-table"><thead><tr>
              ${columns.map(col => `<th scope="col">${col}</th>`).join('')}
            </tr></thead><tbody>`;
        results.forEach(log => {
          const rcvdStatus = createStatusBadge(log.qsl_rcvd, log.qsl_rcvd_date, log.linked_qsl_ids, 'RCVD');
          const sentStatus = createStatusBadge(log.qsl_sent, log.qsl_sent_date, log.linked_qsl_ids, 'SENT');
          html += `
            <tr>
              <td data-label="${columns[0]}">${log.qso_date || 'N/A'}</td>
              <td data-label="${columns[1]}">${log.time_on || 'N/A'}</td>
              <td data-label="${columns[2]}">${log.freq || 'N/A'}</td>
              <td data-label="${columns[3]}">${log.band || 'N/A'}</td>
              <td data-label="${columns[4]}">${log.mode || ''} ${log.submode || ''}</td>
              <td data-label="${columns[5]}">${log.rst_sent || 'N/A'} / ${log.rst_rcvd || 'N/A'}</td>
              <td data-label="${columns[6]}" class="comment-cell">${log.comment || ''} ${log.sat_name ? `(${t.SATELLITE_LABEL}: ${log.sat_name})` : ''}</td>
              <td data-label="${columns[7]}" class="text-center overflow-visible relative">${rcvdStatus}</td>
              <td data-label="${columns[8]}" class="text-center overflow-visible relative">${sentStatus}</td>
            </tr>`;
        });
        html += '</tbody></table></div></div>';
      } else {
        const columns = t.QSL_LOG_COLUMNS;
        const groupedResults = results.reduce((acc, log) => {
          const key = log.qsl_id || 'unlinked';
          if (!acc[key]) acc[key] = { direction: log.direction, status: log.status, logs: [] };
          acc[key].logs.push(log);
          return acc;
        }, {});
        for (const qsl_id in groupedResults) {
          const card = groupedResults[qsl_id];
          const isUnlinked = qsl_id === 'unlinked';
          let directionText = '';
          let statusCircle = '';
          if (isUnlinked) {
            directionText = t.UNLINKED_CARD;
          } else {
            const isTC = card.direction === 'TC';
            const isPending = card.status === 'pending';
            const status = isTC ? (isPending ? t.PENDING_OUT_STATUS : t.SENT_STATUS) : (isPending ? t.PENDING_IN_STATUS : t.RECEIVED_STATUS);
            if (isPending) statusCircle = '<span class="inline-block w-2.5 h-2.5 rounded-full bg-yellow-400 dark:bg-yellow-500 ring-2 ring-yellow-200 dark:ring-yellow-800"></span>';
            let dateStr = '';
            if (card.logs.length > 0) {
              const log = card.logs[0];
              dateStr = isTC ? (log.qsl_sent_date || '') : (log.qsl_rcvd_date || '');
            }
            const formattedDate = formatDate(dateStr);
            directionText = formattedDate ? `${formattedDate} - ${status}` : status;
          }
          const directionColor = isUnlinked
            ? 'bg-gray-100 text-gray-800 dark:bg-gray-600 dark:text-gray-300'
            : (card.status === 'pending'
              ? 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-300'
              : (card.direction === 'TC'
                ? 'bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-300'
                : 'bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-300'));
          html += `
            <div class="result-card">
              <div class="result-card-header">
                <h3 class="text-lg font-semibold text-gray-900 dark:text-white">${isUnlinked ? t.UNLINKED_CARD : qsl_id}</h3>
                <span class="text-xs font-medium px-2.5 py-1 rounded-full inline-flex items-center gap-2 ${directionColor}">${statusCircle}${directionText}</span>
                <span class="result-count">${t.QSO_COUNT(card.logs.length)}</span>
              </div>
              <div class="result-table-wrap"><table class="result-table"><thead><tr>
                ${columns.map(col => `<th scope="col">${col}</th>`).join('')}
              </tr></thead><tbody>`;
          card.logs.forEach(log => {
            html += `
              <tr>
                <td data-label="${columns[0]}">${log.station_callsign || 'N/A'}</td>
                <td data-label="${columns[1]}">${log.qso_date || 'N/A'}</td>
                <td data-label="${columns[2]}">${log.time_on || 'N/A'}</td>
                <td data-label="${columns[3]}">${log.freq || 'N/A'}</td>
                <td data-label="${columns[4]}">${log.band || 'N/A'}</td>
                <td data-label="${columns[5]}">${log.mode || ''} ${log.submode || ''}</td>
                <td data-label="${columns[6]}">${log.rst_sent || 'N/A'} / ${log.rst_rcvd || 'N/A'}</td>
                <td data-label="${columns[7]}" class="comment-cell">${log.comment || ''} ${log.sat_name ? `(${t.SATELLITE_LABEL}: ${log.sat_name})` : ''}</td>
              </tr>`;
          });
          html += '</tbody></table></div></div>';
        }
        if (notFoundItems && notFoundItems.length > 0) {
          html += `<div class="mt-2 p-4 bg-yellow-50 dark:bg-yellow-900/30 rounded-xl"><p class="font-semibold text-yellow-800 dark:text-yellow-300">${t.QSL_NOT_FOUND_INFO}</p><p class="font-mono text-yellow-700 dark:text-yellow-400 mt-1">${notFoundItems.join(', ')}</p></div>`;
        }
      }
      resultsArea.innerHTML = html;
    }

    document.getElementById('search-form').addEventListener('submit', event => {
      event.preventDefault();
      performSearch(qslIdInput.value, 'auto');
    });
    qslIdInput.addEventListener('input', () => {
      clearButton.classList.toggle('visible', qslIdInput.value.length > 0);
    });
    clearButton.addEventListener('click', () => {
      qslIdInput.value = '';
      clearButton.classList.remove('visible');
      qslIdInput.focus();
    });

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const savedLang = getStoredSetting('lang');
        const initialLang = savedLang === 'zh' || savedLang === 'en' ? savedLang : 'zh';
        updateContent(initialLang, false);
      } catch (error) {
        console.error('QSL page initialization warning:', error);
      }
      await initDb();

      // Backward compatibility: old shared links keep their distinct query semantics.
      const urlParams = new URLSearchParams(window.location.search);
      const qslQuery = urlParams.get('q');
      const callsignQuery = urlParams.get('c');
      if (qslQuery) {
        qslIdInput.value = qslQuery;
        clearButton.classList.add('visible');
        await performSearch(qslQuery, 'qsl', true);
        history.pushState(null, '', window.location.pathname);
      } else if (callsignQuery) {
        qslIdInput.value = callsignQuery;
        clearButton.classList.add('visible');
        await performSearch(callsignQuery, 'callsign', true);
        history.pushState(null, '', window.location.pathname);
      }
    });
  </script>
</body>
</html>
